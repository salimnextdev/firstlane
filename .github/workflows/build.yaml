name: Firstlane-Admin Build (Waiting for tests)

on:
  pull_request:
    branches:
      - production
    types: [opened, synchronize, reopened]

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: | 
          docker build -f infra/Dockerfile . \
            --build-arg VITE_API_BASE_URL="https://api.firstlanemultinvestment.com/v1" \
            --build-arg VITE_BASE_URL="https://app.firstlanemultinvestment.com" \
            --build-arg VITE_COOKIE_SECRET="firstlane" \
            -t firstlane-user:latest

      - name: Run health check test
        run: |
          docker run -d --name test-container firstlane-user
          sleep 20
          docker inspect --format='{{json .State.Health}}' test-container
          docker rm -f test-container
