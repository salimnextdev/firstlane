name: Firstlane Frontend Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_and_deploy:
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build --no-cache -f infra/Dockerfile . -t firstlane-frontend:latest

      - name: Login to GHCR
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

      - name: Tag and Push Docker Image
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE=ghcr.io/$GHCR_USERNAME/firstlane-frontend:$SHORT_SHA
          docker tag firstlane-frontend:latest $IMAGE
          docker push $IMAGE
          echo "IMAGE_TAG=$SHORT_SHA" >> $GITHUB_ENV

      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ vars.DOKPLOY_APP_ID }}\"}")
          echo "$RESPONSE"
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Dokploy deployment failed with status $HTTP_CODE"
            exit 1
          fi